[package]
name = "lamb-cadcraft"
description = "LAMB on CADCraft: the adapter between lamb-core and the CADCraft engine, LAMB commands, observers and overlays"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-color = { workspace = true }
cadcraft-constraints = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-engine = { workspace = true }
cadcraft-geom = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-render = { workspace = true }
lamb-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
craft-pdf = { workspace = true, features = ["read"] }
